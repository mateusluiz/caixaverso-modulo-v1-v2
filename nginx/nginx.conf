worker_processes 1;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;

    # log pra evidencia
    # Campos principais: IP, metodo, status, tempo no upstream e uri.
    log_format simple_structured 'client_ip=$remote_addr '
                                 'method=$request_method '
                                 'status=$status '
                                 'upstream_response_time=$upstream_response_time '
                                 'uri="$request_uri"';

    # Arquivos de log.
    access_log /var/log/nginx/access.log simple_structured;
    error_log /var/log/nginx/error.log warn;

    # Rate limit por IP: 5 req/s.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

    # Quando estourar o limite, retorna 429.
    limit_req_status 429;

    # Cache global
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=50m inactive=30s;

    # GZIP para resposta JSON e texto.
    gzip on;
    gzip_vary on;
    gzip_min_length 1;
    gzip_types application/json text/plain;

    # load balancer (round-robin)
    # Nginx distribui entre app1 e app2
    upstream finances_backend {
        server app1:8080;
        server app2:8080;
    }

    server {
        # Porta publica do projeto.
        listen 80;
        server_name _;

        # Limite maximo de payload por request.
        client_max_body_size 1m;

        # Headers de seguranca para proteger contra ataques comuns.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Paginas de erro personalizadas
        error_page 404 /errors/404.html;
        error_page 502 503 504 /errors/50x.html;

        # Arquivo fisico da pagina 404.
        location = /errors/404.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Arquivo fisico da pagina 50x.
        location = /errors/50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        location /q/swagger-ui {
            auth_basic "Swagger Protected";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://finances_backend;
        }

        location /q/openapi {
            auth_basic "Swagger Protected";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://finances_backend;
        }

        location / {
            # Rate limit configurado acima
            limit_req zone=api_limit burst=10 nodelay;

            # Headers de proxy para encaminhar informacoes do cliente para a API
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Repito os headers de seguranca neste location
            # se eu tiver add_header no location, preciso repetir os do server
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header X-XSS-Protection "1; mode=block" always;

            # Cache de GET por 10s.
            proxy_cache api_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 10s;

            # Se vier Authorization, ignoro cache
            proxy_cache_bypass $http_authorization;
            proxy_no_cache $http_authorization;

            # Headers uteis para demonstracao de cache
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Upstream-Addr $upstream_addr always;

            # Permite usar as paginas customizadas para erros de proxy
            proxy_intercept_errors on;

            # Encaminha para o app da API
            proxy_pass http://finances_backend;
        }
    }
}
